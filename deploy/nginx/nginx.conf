# Main nginx configuration for the Taskora `web` image.
#
# The container runs nginx as the unprivileged `nginx` user (uid 101), so:
#   - there is no `user` directive,
#   - the pid file and all temp paths live in /tmp,
#   - the server listens on 8080 (see conf.d/taskora.conf).
# The site itself is rendered at container start from
# /etc/nginx/templates/taskora.conf.template by the official image entrypoint.

worker_processes auto;
pid /tmp/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time urt=$upstream_response_time';
    access_log /var/log/nginx/access.log main;

    sendfile           on;
    tcp_nopush         on;
    keepalive_timeout  65s;
    server_tokens      off;

    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        application/manifest+json
        image/svg+xml
        font/ttf
        font/otf;

    include /etc/nginx/conf.d/*.conf;
}
